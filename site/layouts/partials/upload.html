<div class="upload-area" style="display: flex; gap: 0 1rem;">
  <div>
    <label for="top-upload">Upload Top Image:</label>
    <input type="file" id="top-upload" accept="image/png,image/jpeg,image/webp" />
    <div id="top-error" class="upload-error" role="alert"></div>
  </div>
  <div>
    <label for="infinite-upload">Upload Infinite Image:</label>
    <input type="file" id="infinite-upload" accept="image/png,image/jpeg,image/webp" />
    <div id="infinite-error" class="upload-error" role="alert"></div>
  </div>
</div>
