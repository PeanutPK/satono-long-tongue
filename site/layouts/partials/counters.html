<div class="counters">
  <h2>Rarity Encounters</h2>
  <div class="counter-grid">
    <div class="counter-item">
      <span class="counter-label">Common:</span>
      <span id="common-counter" class="counter-value">0</span>
    </div>
    <div class="counter-item counter-rare">
      <span class="counter-label">Rare:</span>
      <span id="rare-counter" class="counter-value">0</span>
    </div>
    <div class="counter-item counter-epic">
      <span class="counter-label">Epic:</span>
      <span id="epic-counter" class="counter-value">0</span>
    </div>
    <div class="counter-item counter-wow">
      <span class="counter-label">WOW:</span>
      <span id="wow-counter" class="counter-value">0</span>
    </div>
  </div>
  <div id="aria-live-wow" aria-live="assertive" class="visually-hidden"></div>
</div>
